# Cloud data collection, independent of the Mac (eng review OV#9):
#   backup/  TfL line status + disruptions, change-only (same code as the Mac's logger)
#   bikes/   bike-dock occupancy summarised per station (~1 KB per snapshot; the backtest proxy)
# Written to the separate `data` branch so bot commits never touch `main`.
# GitHub may delay scheduled runs; gaps of 5-15 min are expected and fine for T8/T11.
name: tfl-snapshot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tfl-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Code (main)
        uses: actions/checkout@v4
      - name: Data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: databranch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: TfL status + disruptions (change-only)
        env:
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
        run: python -m workers.logger --once --feeds status,disruption --data-dir databranch/backup
      - name: Bike docks per station
        env:
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
        run: python -m workers.bike_summary --out databranch/bikes || echo "bike summary skipped this run"
      - name: Commit to data branch
        working-directory: databranch
        run: |
          git config user.name "surgesignal-bot"
          git config user.email "surgesignal-bot@users.noreply.github.com"
          git add backup/raw bikes 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase origin data && git push -q origin HEAD:data && exit 0; sleep 5; done
          exit 1
